<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256, 256)">
    <!-- Car body -->
    <path d="M-140 20 L-120 20 L-100 -30 L100 -30 L120 20 L140 20 L140 60 L-140 60 Z" fill="white" opacity="0.95"/>
    <!-- Car roof -->
    <path d="M-70 -30 L-50 -70 L50 -70 L70 -30 Z" fill="white" opacity="0.85"/>
    <!-- Windows -->
    <path d="M-60 -28 L-45 -60 L45 -60 L60 -28 Z" fill="#8b5cf6" opacity="0.4"/>
    <!-- Wheels -->
    <circle cx="-80" cy="60" r="30" fill="#333"/>
    <circle cx="-80" cy="60" r="18" fill="#666"/>
    <circle cx="-80" cy="60" r="8" fill="#999"/>
    <circle cx="80" cy="60" r="30" fill="#333"/>
    <circle cx="80" cy="60" r="18" fill="#666"/>
    <circle cx="80" cy="60" r="8" fill="#999"/>
    <!-- Headlights -->
    <ellipse cx="-120" cy="0" rx="12" ry="8" fill="#ffd700"/>
    <ellipse cx="120" cy="0" rx="12" ry="8" fill="#ff4444"/>
  </g>
  <!-- Text -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">AutoVerse</text>
</svg>
